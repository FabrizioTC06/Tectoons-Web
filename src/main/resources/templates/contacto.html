<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecToons - Contacto</title>
    <link rel="icon" th:href="@{/img/logotectoons4.png}" type="image/png">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- ✅ CSS desde static -->
    <link th:href="@{/css/contacto.main.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>

<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container mt-5">

        <div class="logo-container">
            <div class="logo glow-text">TecToons</div>
            <div class="tagline">Conectemos y creemos algo increíble juntos</div>
        </div>

        <!-- ✅ Mensaje de éxito -->
        <div th:if="${success}" class="alert alert-success text-center fw-semibold">
            <span th:text="${success}"></span>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="contact-card">
                    <div class="contact-title">Envíanos un Mensaje</div>
                    <p class="contact-info mb-4">
                        ¿Tienes una idea para un proyecto? ¡Nos encanta escuchar propuestas creativas!
                    </p>

                    <!-- ✅ Enlace al controlador + Bean validado -->
                    <form th:action="@{/contacto}" th:object="${contacto}" method="post">

                        <div class="row">
                            <div class="col-md-6 mb-2">
                                <input th:field="*{nombre}" type="text" class="form-control"
                                    placeholder="Tu nombre completo">
                                <div class="text-warning small" th:errors="*{nombre}"
                                    th:if="${#fields.hasErrors('nombre')}"></div>
                            </div>

                            <div class="col-md-6 mb-2">
                                <input th:field="*{email}" type="email" class="form-control"
                                    placeholder="Tu correo electrónico">
                                <div class="text-warning small" th:errors="*{email}"
                                    th:if="${#fields.hasErrors('email')}"></div>
                            </div>
                        </div>

                        <div class="mb-2">
                            <input th:field="*{asunto}" type="text" class="form-control"
                                placeholder="Asunto del mensaje">
                            <div class="text-warning small" th:errors="*{asunto}"
                                th:if="${#fields.hasErrors('asunto')}"></div>
                        </div>

                        <div class="mb-2">
                            <textarea th:field="*{mensaje}" class="form-control" rows="5"
                                placeholder="Cuéntanos tu consulta o proyecto..."></textarea>
                            <div class="text-warning small" th:errors="*{mensaje}"
                                th:if="${#fields.hasErrors('mensaje')}"></div>
                        </div>

                        <div class="text-center mt-3">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-paper-plane me-2"></i>Enviar mensaje
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>

    </div>

    <div th:replace="fragments/footer :: footer"></div>

    <script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js}"></script>

</body>

</html>
