<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil de Artista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" th:href="@{/img/logotectoonsartista2.png}" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>

<body class="bg-light">
    <div th:replace="fragments/navbar-artista :: navbar-artista"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-header text-white text-center rounded-top-4"
                        style="background: linear-gradient(90deg, #3a0ca3 0%, #1a237e 100%);">
                        <h3 class="mb-0 fw-bold">Editar Perfil de Artista</h3>
                    </div>


                    <div class="card-body p-4">
                        <!-- Mensajes -->
                        <div th:if="${exito}" class="alert alert-success rounded-3 shadow-sm" th:text="${exito}"></div>
                        <div th:if="${error}" class="alert alert-danger rounded-3 shadow-sm" th:text="${error}"></div>

                        <!-- Formulario -->
                        <form th:action="@{/artista/editar-perfil}" th:object="${usuario}" method="post"
                            enctype="multipart/form-data">
                            <!-- Banner -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Banner de perfil</label>
                                <input type="text" class="form-control rounded-3" th:field="*{bannerPerfil}"
                                    placeholder="URL del banner">
                            </div>

                            <!-- Foto perfil -->
                            <div class="mb-4 text-center">
                                <img th:src="@{${usuario.fotoPerfil}}"
                                    class="rounded-circle border border-3 shadow-sm mb-3"
                                    style="width:120px;height:120px;object-fit:cover;">
                                <input type="text" class="form-control rounded-3" th:field="*{fotoPerfil}"
                                    placeholder="URL de foto">
                            </div>

                            <!-- Datos usuario -->
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Nombre completo</label>
                                    <input type="text" class="form-control rounded-3" th:field="*{nombreCompleto}"
                                        required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Nombre de usuario</label>
                                    <input type="text" class="form-control rounded-3" th:field="*{nombreUsuario}"
                                        required>
                                </div>
                            </div>

                            <div class="row g-3 mt-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Correo electrónico</label>
                                    <input type="email" class="form-control rounded-3" th:field="*{correo}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Fecha de nacimiento</label>
                                    <input type="date" class="form-control rounded-3" th:field="*{fechaNacimiento}">
                                </div>
                            </div>

                            <div class="row g-3 mt-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Ubicación</label>
                                    <input type="text" class="form-control rounded-3" th:field="*{ubicacion}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Celular</label>
                                    <input type="text" class="form-control rounded-3" th:field="*{celular}"
                                        pattern="\d{9}" placeholder="912345678">
                                </div>
                            </div>

                            <div class="mt-3">
                                <label class="form-label fw-semibold">Descripción</label>
                                <textarea class="form-control rounded-3" th:field="*{descripcion}" rows="3"></textarea>
                            </div>

                            <!-- Contraseña -->
                            <div class="row g-3 mt-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Nueva contraseña (opcional)</label>
                                    <input type="password" class="form-control rounded-3" th:field="*{contrasena}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Repetir nueva contraseña</label>
                                    <input type="password" class="form-control rounded-3" name="repetirContrasena">
                                </div>
                            </div>

                            <hr class="my-4">

                            <!-- Campos Artista -->
                            <div th:object="${artista}">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Nombre artístico</label>
                                    <input type="text" class="form-control rounded-3" th:field="*{nombreArtistico}"
                                        required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Categoría Principal</label>
                                    <select class="form-select rounded-3" th:field="*{categoriaPrincipal}" required>
                                        <option value="" disabled selected>Seleccione una categoría</option>
                                        <option value="Ilustrador">Ilustrador</option>
                                        <option value="Artista de Personajes">Artista de Personajes</option>
                                        <option value="Artista de Animación">Artista de Animación</option>
                                        <option value="Artista Estilizado">Artista Estilizado</option>
                                        <option value="Artista de Escenarios">Artista de Escenarios</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Biografía</label>
                                    <textarea class="form-control rounded-3" th:field="*{biografiaLarga}"
                                        rows="4"></textarea>
                                </div>

                                <!-- Redes sociales -->
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Instagram</label>
                                        <input type="url" class="form-control rounded-3" th:field="*{instagram}">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">TikTok</label>
                                        <input type="url" class="form-control rounded-3" th:field="*{tiktok}">
                                    </div>
                                </div>

                                <div class="row g-3 mt-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">X/Twitter</label>
                                        <input type="url" class="form-control rounded-3" th:field="*{x}">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">YouTube</label>
                                        <input type="url" class="form-control rounded-3" th:field="*{youtube}">
                                    </div>
                                </div>

                                <div class="row g-3 mt-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Portafolio</label>
                                        <input type="url" class="form-control rounded-3" th:field="*{portafolioUrl}">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Sitio web</label>
                                        <input type="url" class="form-control rounded-3" th:field="*{sitioWeb}">
                                    </div>
                                </div>
                            </div>

                            <!-- Botones -->
                            <div class="d-flex justify-content-between mt-4">
                                <a href="/artista/mi-perfil"
                                    class="btn btn-outline-secondary btn-lg rounded-3 px-4">Volver</a>
                                <button type="submit" class="btn btn-gradient btn-lg rounded-3 px-4 text-white"
                                    style="background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);">
                                    Guardar cambios
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>


        <!-- Footer -->
        <div th:replace="fragments/footer :: footer"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
