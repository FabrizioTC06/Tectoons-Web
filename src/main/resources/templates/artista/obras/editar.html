<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Obra</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <h2 class="fw-bold mb-4">Editar Obra</h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <form th:action="@{/obras/actualizar}" th:object="${obra}" method="post">

                <!-- ID oculto -->
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input type="text" th:field="*{titulo}" class="form-control" required>
                    <small class="text-danger" th:if="${#fields.hasErrors('titulo')}" 
                          th:errors="*{titulo}"></small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea th:field="*{descripcion}" rows="4" class="form-control"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Imagen URL</label>
                    <input type="text" th:field="*{imagenUrl}" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Video URL</label>
                    <input type="text" th:field="*{videoUrl}" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoría</label>
                    <input type="text" th:field="*{categoria}" class="form-control">
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/obras/mis-obras" class="btn btn-secondary">Cancelar</a>
                    <button class="btn btn-warning" type="submit">Actualizar</button>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
