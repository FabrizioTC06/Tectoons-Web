<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Artistas - TecToons</title>
    <link rel="icon" th:href="@{/img/logotectoons4.png}" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- Fuente Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- CSS principal -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/lista-artistas.css}">

</head>

<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container py-5">
<h1 class="mb-4 text-center fw-bold text-primary display-5">Conoce a nuestros artistas</h1>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">
        <div class="col" th:each="artista : ${artistas}">
            <div class="artist-card h-100 d-flex flex-column">
                <div class="artist-img-wrapper">
                    <img th:src="${artista.usuario.fotoPerfil != null ? artista.usuario.fotoPerfil : 'https://i.pinimg.com/1200x/2f/24/22/2f2422f8bc68c16756860212bb6c8bd9.jpg'}"
                         class="artist-img" alt="Foto de perfil">
                    
                    <span class="artist-tag" th:text="${artista.categoriaPrincipal}">Categoría</span>
                </div>

                <div class="card-body d-flex flex-column">
                    <h5 class="artist-title" th:text="${artista.nombreArtistico}">Nombre Artista</h5>

                    <p class="artist-bio" th:text="${artista.biografiaLarga}">
                        Biografía…
                    </p>

                    <div class="mt-auto d-flex justify-content-between align-items-center gap-2">
                        <a th:href="@{/detalle-artista/{id}(id=${artista.id})}"
                           class="btn btn-detail flex-grow-1 text-center">
                            Ver Perfil
                        </a>

                        <button type="button" class="btn btn-follow"
                            th:classappend="${loggedIn and idsSeguidos.contains(artista.id) ? ' following' : ''}"
                            th:data-artista-id="${loggedIn ? artista.id : ''}"
                            th:text="${loggedIn and idsSeguidos.contains(artista.id) ? 'Siguiendo' : 'Seguir'}">
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

    <!-- Modal de alerta si no hay sesión 
<div class="modal fade" id="loginRequiredModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center p-4">
            <h5 class="mb-3"><i class="bi bi-exclamation-circle text-warning"></i> Inicia sesión</h5>
            <p>Necesitas iniciar sesión para reaccionar o seguir a un artista.</p>
            <div class="mt-3">
                <a th:href="@{/usuario/login}" class="btn btn-primary">Iniciar sesión</a>
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>-->
    <!-- Footer -->
    <div th:replace="fragments/footer :: footer"></div>
    <div th:replace="fragments/modals :: loginRequiredModal"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function () {
            $('.btn-follow').click(function () {
                const btn = $(this);
                const artistaId = btn.data('artista-id');

                if (!artistaId) {
                    const modalEl = document.getElementById('loginRequiredModal');
                    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
                    modal.show();
                    return;
                }

                $.ajax({
                    url: `/api/seguidores/toggle/${artistaId}`,
                    type: 'POST',
                    success: function (data) {
                        if (data.ok) {
                            if (data.siguiendo) {
                                btn.removeClass('btn-outline-secondary').addClass('btn-success').text('Siguiendo');
                            } else {
                                btn.removeClass('btn-success').addClass('btn-outline-secondary').text('Seguir');
                            }
                        } else {
                            alert('Error: ' + data.error);
                        }
                    },
                    error: function () {
                        alert('Ocurrió un error en la conexión.');
                    }
                });
            });
        });

    </script>
</body>

</html>
