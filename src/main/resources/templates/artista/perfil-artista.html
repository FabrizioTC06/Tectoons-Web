<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Artista</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="icon" th:href="@{/img/logotectoonsartista2.png}" type="image/png">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/perfil-artista.css}">

</head>

<body class="bg-light">

    <!-- Navbar -->
    <div th:replace="fragments/navbar-artista :: navbar-artista"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">

                <!-- Perfil Artista -->
                <div class="card info-card border-0 shadow-lg rounded-4 overflow-hidden">

                    <!-- Banner -->
                    <div th:if="${usuario.bannerPerfil != null}" class="banner position-relative"
                        th:style="'background-image: url(' + ${usuario.bannerPerfil} + ');'">
                        <div class="overlay"></div>
                    </div>

                    <div class="card-body text-center position-relative">

                        <!-- Foto de perfil -->
                        <div class="profile-pic-wrapper">
                            <img th:src="@{${usuario.fotoPerfil}}" alt="Foto de perfil"
                                class="rounded-circle profile-img shadow-lg border border-3 border-white">
                        </div>

                        <!-- Nombre y categoria -->
                        <h2 class="mt-3 fw-bold text-dark" th:text="${artista.nombreArtistico}">Nombre Artístico</h2>
                        <p class="text-muted mb-1">@<span th:text="${usuario.nombreUsuario}">usuario</span></p>
                        <span class="badge bg-gradient mb-3 px-3 py-2"
                            th:text="${artista.categoriaPrincipal}">Categoría</span>

                        <!-- Boton Seguir / Editar -->
                        <div class="d-flex justify-content-center mb-4 gap-3 flex-wrap">
                            <a th:href="@{/artista/editar-perfil}"
                                class="btn btn-outline-primary btn-sm rounded-pill px-3">
                                <i class="bi bi-pencil-square"></i> Editar Perfil
                            </a>
                            <div class="followers-box px-3 py-2 bg-light rounded-pill shadow-sm">
                                <i class="bi bi-people-fill me-1 text-primary"></i>
                                <span th:text="${seguidoresCount}">0</span> seguidores
                            </div>
                        </div>

                        <hr class="my-4">

                        <!-- Informacion personal -->
                        <div class="row text-start mb-4 g-3">
                            <div class="col-md-6">
                                <i class="bi bi-person-circle me-1 text-primary"></i>
                                <strong>Nombre completo:</strong> <span th:text="${usuario.nombreCompleto}"></span>
                            </div>
                            <div class="col-md-6" th:if="${usuario.correo != null}">
                                <i class="bi bi-envelope me-1 text-primary"></i>
                                <strong>Correo:</strong> <span th:text="${usuario.correo}"></span>
                            </div>
                            <div class="col-md-6" th:if="${usuario.fechaNacimiento != null}">
                                <i class="bi bi-calendar me-1 text-primary"></i>
                                <strong>Fecha de nacimiento:</strong>
                                <span th:text="${#temporals.format(usuario.fechaNacimiento, 'dd/MM/yyyy')}"></span>
                            </div>
                            <div class="col-md-6" th:if="${usuario.ubicacion != null}">
                                <i class="bi bi-geo-alt me-1 text-primary"></i>
                                <strong>Ubicación:</strong> <span th:text="${usuario.ubicacion}"></span>
                            </div>
                            <div class="col-md-6" th:if="${usuario.celular != null}">
                                <i class="bi bi-telephone me-1 text-primary"></i>
                                <strong>Celular:</strong> <span th:text="${usuario.celular}"></span>
                            </div>
                        </div>

                        <!-- Biografia y descripcion -->
                        <div class="text-start mb-4" th:if="${usuario.descripcion != null}">
                            <h5 class="section-title text-primary fw-bold">Sobre mí</h5>
                            <p th:text="${usuario.descripcion}"></p>
                        </div>

                        <div class="text-start mb-4" th:if="${artista.biografiaLarga != null}">
                            <h5 class="section-title text-primary fw-bold">Biografía artística</h5>
                            <p th:text="${artista.biografiaLarga}"></p>
                        </div>

                        <!-- Redes sociales -->
                        <div class="text-start mb-4" th:if="${artista.instagram != null 
                                                         or artista.tiktok != null 
                                                         or artista.x != null 
                                                         or artista.youtube != null}">
                            <h5 class="section-title text-primary fw-bold">Redes sociales</h5>
                            <div class="social-icons d-flex gap-3 fs-4">
                                <a th:if="${artista.instagram != null}" th:href="${artista.instagram}" target="_blank"
                                    class="text-danger"><i class="bi bi-instagram"></i></a>
                                <a th:if="${artista.tiktok != null}" th:href="${artista.tiktok}" target="_blank"
                                    class="text-dark"><i class="bi bi-tiktok"></i></a>
                                <a th:if="${artista.x != null}" th:href="${artista.x}" target="_blank"
                                    class="text-dark"><i class="bi bi-twitter-x"></i></a>
                                <a th:if="${artista.youtube != null}" th:href="${artista.youtube}" target="_blank"
                                    class="text-danger"><i class="bi bi-youtube"></i></a>
                            </div>
                        </div>

                        <!-- Portafolio y sitio web -->
                        <div class="text-start mb-4">
                            <p th:if="${artista.portafolioUrl != null}">
                                <i class="bi bi-folder2-open me-1 text-primary"></i>
                                <strong>Portafolio:</strong>
                                <a th:href="${artista.portafolioUrl}" target="_blank" th:text="${artista.portafolioUrl}"
                                    class="text-decoration-none text-dark fw-semibold"></a>
                            </p>
                            <p th:if="${artista.sitioWeb != null}">
                                <i class="bi bi-globe me-1 text-primary"></i>
                                <strong>Sitio web:</strong>
                                <a th:href="${artista.sitioWeb}" target="_blank" th:text="${artista.sitioWeb}"
                                    class="text-decoration-none text-dark fw-semibold"></a>
                            </p>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>


    <!-- Footer -->
    <div th:replace="fragments/footer :: footer"></div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Toggle Follow Script -->
    <script th:inline="javascript">
        const btnSeguir = document.getElementById('btnSeguir');
        if (btnSeguir) {
            btnSeguir.addEventListener('click', () => {
                const artistaId = btnSeguir.getAttribute('data-artista-id');
                fetch('/api/seguidores/toggle/' + artistaId, { method: 'POST' })
                    .then(res => res.json())
                    .then(data => {
                        if (data.ok) {
                            btnSeguir.innerHTML = data.siguiendo
                                ? '<i class="bi bi-person-check"></i> Siguiendo'
                                : '<i class="bi bi-person-plus"></i> Seguir';
                        } else if (data.error === 'no-auth') {
                            alert('Debes iniciar sesión para seguir a este artista.');
                        }
                    });
            });

            // Inicializar estado
            const artistaId = btnSeguir.getAttribute('data-artista-id');
            fetch('/api/seguidores/exists/' + artistaId)
                .then(res => res.json())
                .then(data => {
                    if (data.exists) {
                        btnSeguir.innerHTML = '<i class="bi bi-person-check"></i> Siguiendo';
                    }
                });
        }
    </script>

</body>

</html>
