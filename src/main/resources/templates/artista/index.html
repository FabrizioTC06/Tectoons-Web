<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Artista - TecToons</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Fuente Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        body {
            background: #0f0f0f;
            color: white;
        }

        .dashboard-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 15px;
            transition: 0.3s;
            cursor: pointer;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0px 10px 20px rgba(255, 255, 255, 0.05);
        }

        .dashboard-card i {
            font-size: 40px;
            color: #0d6efd;
        }

        .header-banner {
            background: linear-gradient(135deg, #111, #222);
            padding: 40px;
            border-radius: 20px;
        }

        .header-banner h2 {
            font-weight: bold;
        }

        .header-banner p {
            opacity: 0.8;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>

<body>

    <!-- Navbar -->
    <div th:replace="fragments/navbar-artista :: navbar-artista"></div>

    <div class="container py-5">

        <!-- Encabezado -->
        <div class="header-banner mb-5 text-center">
            <h2>🎨 Dashboard del Artista</h2>
            <p>Administra tus obras, productos, publicaciones y perfil artístico.</p>
        </div>

        <!-- Contenedor de tarjetas -->
        <div class="row g-4">

            <!-- MIS OBRAS -->
            <div class="col-12 col-md-6 col-lg-3">
                <a th:href="@{/artista/mis-obras}" class="text-decoration-none text-white">
                    <div class="dashboard-card p-4 text-center">
                        <i class="fas fa-palette mb-3"></i>
                        <h5 class="fw-bold">Mis Obras</h5>
                        <p class="small opacity-75">Gestiona tu portafolio artístico</p>
                    </div>
                </a>
            </div>

            <!-- MIS PRODUCTOS -->
            <div class="col-12 col-md-6 col-lg-3">
                <a th:href="@{/artista/mis-productos}" class="text-decoration-none text-white">
                    <div class="dashboard-card p-4 text-center">
                        <i class="fas fa-store mb-3"></i>
                        <h5 class="fw-bold">Mis Productos</h5>
                        <p class="small opacity-75">Administra productos y ventas</p>
                    </div>
                </a>
            </div>

            <!-- MIS POSTS -->
            <div class="col-12 col-md-6 col-lg-3">
                <a th:href="@{/artista/mis-posts}" class="text-decoration-none text-white">
                    <div class="dashboard-card p-4 text-center">
                        <i class="fas fa-feather-alt mb-3"></i>
                        <h5 class="fw-bold">Mis Posts</h5>
                        <p class="small opacity-75">Publica noticias y actualizaciones</p>
                    </div>
                </a>
            </div>

            <!-- MI PERFIL -->
            <div class="col-12 col-md-6 col-lg-3">
                <a th:href="@{/artista/mi-perfil}" class="text-decoration-none text-white">
                    <div class="dashboard-card p-4 text-center">
                        <i class="fas fa-user-artist mb-3"></i>
                        <h5 class="fw-bold">Mi Perfil</h5>
                        <p class="small opacity-75">Edita tu información de artista</p>
                    </div>
                </a>
            </div>

        </div>

    </div>

    <!-- Footer -->
    <div th:replace="fragments/footer :: footer"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
