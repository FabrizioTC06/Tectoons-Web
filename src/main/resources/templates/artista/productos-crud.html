<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Productos - [[${artista.nombreArtistico}]]</title>
    <link rel="icon" th:href="@{/img/logotectoonsartista2.png}" type="image/png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Animate -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/productos-crud.css}">


</head>

<body>
    <div th:replace="fragments/navbar-artista :: navbar-artista"></div>

    <div class="container mt-5">
        <h2 class="mb-4 fw-bold text-primary">
            Productos de <span th:text="${artista.nombreArtistico}">Artista</span>
        </h2>

        <!-- Botón nuevo producto -->
        <button class="btn btn-gradient mb-3 rounded-pill px-4" id="btnNuevo">
            <i class="bi bi-plus-circle"></i> Nuevo Producto
        </button>

        <!-- Filtros -->
        <div class="row mb-4 g-3">
            <div class="col-md-6">
                <input type="text" id="searchTitulo" class="form-control rounded-pill shadow-sm"
                    placeholder="🔍 Buscar por título">
            </div>
            <div class="col-md-4">
                <select id="searchCategoria" class="form-select rounded-pill shadow-sm">
                    <option value="">Todas las categorías</option>
                    <option>Sticker</option>
                    <option>Llavero</option>
                    <option>Poster</option>
                    <option>Print</option>
                    <option>Figura</option>
                </select>
            </div>
        </div>

        <!-- Tabla -->
        <div class="table-responsive shadow-lg rounded-4">
            <table class="table table-hover align-middle text-center mb-0">
                <thead class="bg-gradient text-white" style="background: linear-gradient(90deg,#6a11cb,#2575fc);">
                    <tr>
                        <th class="text-center" data-column="id" onclick="sortTable(this)">ID</th>
                        <th class="text-center" data-column="titulo" onclick="sortTable(this)">Título <i
                                class="bi bi-arrow-down-up"></i></th>
                        <th class="text-center" data-column="categoria" onclick="sortTable(this)">Categoría <i
                                class="bi bi-arrow-down-up"></i></th>
                        <th class="text-center" data-column="precio" onclick="sortTable(this)">Precio <i
                                class="bi bi-arrow-down-up"></i></th>
                        <th class="text-center" data-column="stock" onclick="sortTable(this)">Stock <i
                                class="bi bi-arrow-down-up"></i></th>
                        <th class="text-center">Imagen</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="productosTable">
                    <tr th:each="producto, iterStat : ${productos}" th:data-id="${producto.id}">
                        <td th:text="${iterStat.count}"></td>
                        <td th:text="${producto.titulo}"></td>
                        <td th:text="${producto.categoria}"></td>
                        <td>S/ <span th:text="${producto.precio}"></span></td>
                        <td>
                            <span th:if="${producto.stock <= 5}"
                                class="badge bg-danger animate__animated animate__pulse animate__infinite">
                                Stock Bajo: [[${producto.stock}]]
                            </span>
                            <span th:if="${producto.stock > 5}" class="badge bg-success">[[${producto.stock}]]</span>
                        </td>
                        <td>
                            <img th:src="${producto.imagenUrl}" class="img-thumbnail"
                                style="width:60px;height:60px;object-fit:cover;">
                        </td>
                        <td>
                            <button class="btn btn-outline-primary btn-sm rounded-pill btnEditar"><i
                                    class="bi bi-pencil-square"></i></button>
                            <button class="btn btn-outline-danger btn-sm rounded-pill btnEliminar"><i
                                    class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Crear/Editar -->
    <div class="modal fade" id="productoModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content rounded-4 shadow-lg">
                <form id="formProducto">
                    <div class="modal-header bg-light text-dark rounded-top-4">
                        <h5 class="modal-title fw-bold" id="modalTitle">Nuevo Producto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <input type="hidden" id="productoId">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Título</label>
                                <input type="text" id="titulo" class="form-control rounded-pill" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Categoría</label>
                                <select id="categoria" class="form-select rounded-pill" required>
                                    <option value="">Seleccione categoría</option>
                                    <option>Sticker</option>
                                    <option>Llavero</option>
                                    <option>Poster</option>
                                    <option>Print</option>
                                    <option>Figura</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-3">
                            <label class="form-label fw-semibold">Stock actual</label>
                            <input type="number" class="form-control campo-readonly rounded-pill" id="stockActual"
                                readonly>
                        </div>

                        <div id="alertaStock" class="alert alert-danger text-center fw-bold d-none mt-2">
                            ⚠ Stock Bajo — agrega más unidades
                        </div>

                        <div class="mt-3">
                            <label class="form-label fw-semibold">Agregar unidades</label>
                            <input type="number" id="stockAgregar" class="form-control rounded-pill" value="0" min="0">
                        </div>

                        <div class="mt-3">
                            <label class="form-label fw-semibold">Precio</label>
                            <input type="number" step="0.5" id="precio" class="form-control rounded-pill" required>
                            <div id="errorPrecio" class="text-danger mt-1 d-none" style="font-size: 0.9rem;">
                                El precio debe ser mayor a 0
                            </div>
                        </div>

                        <div class="mt-3">
                            <label class="form-label fw-semibold">URL imagen</label>
                            <input type="text" id="imagenUrl" class="form-control rounded-pill">
                        </div>

                        <div class="mt-3">
                            <label class="form-label fw-semibold">Descripción</label>
                            <textarea id="descripcion" class="form-control rounded-3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-gradient rounded-pill px-4" type="submit">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="position-fixed bottom-0 end-0 p-3">
        <div id="toastMensaje" class="toast text-white border-0 shadow-lg rounded-3"
            style="background: linear-gradient(90deg,#00c6ff,#0072ff); font-size:1.1rem; padding:14px 20px;">
            <div class="d-flex">
                <div class="toast-body fw-bold" id="toastBody">Mensaje</div>
                <button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- Modal Eliminar -->
    <div class="modal fade" id="eliminarModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-danger rounded-4 shadow-lg">
                <div class="modal-header bg-danger text-white rounded-top-4">
                    <h5 class="modal-title">Eliminar Producto</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body fs-5">
                    ¿Seguro que quieres eliminar?
                    <div class="fw-bold text-danger" id="nombreProductoEliminar"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-danger rounded-pill" id="btnConfirmarEliminar">Eliminar</button>
                </div>
            </div>
        </div>
    </div>


    <!-- Footer -->
    <div th:replace="fragments/footer :: footer"></div>
    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script th:src="@{/js/productos-crud.main.js}"></script>


</body>

</html>
