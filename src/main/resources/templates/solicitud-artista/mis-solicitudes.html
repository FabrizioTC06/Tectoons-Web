<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Solicitudes</title>
    <link rel="icon" th:href="@{/img/logotectoons4.png}" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>

<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container mt-5">
        <h2>Mis Solicitudes de Artista</h2>

        <div th:if="${solicitudes.isEmpty()}">
            <p>No has enviado ninguna solicitud todavía.</p>
            <a href="/solicitud-artista" class="btn btn-primary">Enviar solicitud</a>
        </div>

        <table class="table table-striped mt-3" th:if="${!solicitudes.isEmpty()}">
            <thead>
                <tr>
                    <th>Nombre Artístico</th>
                    <th>Categoría</th>
                    <th>Motivo</th>
                    <th>Evidencia</th>
                    <th>Estado</th>
                    <th>Fecha de Solicitud</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="solicitud : ${solicitudes}">
                    <td th:text="${solicitud.nombreArtistico}"></td>
                    <td th:text="${solicitud.categoriaPrincipal}"></td>
                    <td th:text="${solicitud.motivo}"></td>
                    <td>
                        <a th:if="${solicitud.evidenciaUrl}" th:href="${solicitud.evidenciaUrl}" target="_blank">Ver
                            evidencia</a>
                        <span th:if="${#strings.isEmpty(solicitud.evidenciaUrl)}">N/A</span>
                    </td>

                    <td th:text="${solicitud.estado}"></td>
                    <td th:text="${#temporals.format(solicitud.fechaSolicitud, 'dd/MM/yyyy HH:mm')}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="fragments/footer :: footer"></div>

</body>

</html>
