<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda - TecToons</title>
    <link rel="icon" th:href="@{/img/logotectoons4.png}" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>

<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold mb-3 display-5 text-primary">
                <i class="bi bi-shop me-2"></i>Tienda TecToons
            </h1>
            <p class="text-muted lead">Descubre productos unicos y creativos</p>
        </div>
        <!-- Filtro -->
        <form method="get" class="mb-5">
            <div class="row justify-content-center">
                <div class="col-lg-8 col-md-10">
                    <div class="card shadow-sm border-light">
                        <div class="card-body p-3">
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-light border-light">
                                    <i class="bi bi-filter text-primary"></i>
                                </span>
                                <select name="categoria" class="form-select border-light" onchange="this.form.submit()">
                                    <option th:value="''" th:selected="${categoria == null}">Todas las categorías
                                    </option>
                                    <option value="Sticker" th:selected="${categoria == 'Sticker'}">Sticker</option>
                                    <option value="Llavero" th:selected="${categoria == 'Llavero'}">Llavero</option>
                                    <option value="Poster" th:selected="${categoria == 'Poster'}">Póster</option>
                                    <option value="Print" th:selected="${categoria == 'Print'}">Print</option>
                                    <option value="Figura" th:selected="${categoria == 'Figura'}">Figura</option>
                                </select>
                                <button class="btn btn-primary" type="submit">
                                    <i class="bi bi-funnel me-2"></i>Filtrar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="row g-4">
            <div class="col-xl-3 col-lg-4 col-md-6 mb-4" th:each="producto : ${productos}">
                <div class="card product-card h-100 shadow-sm border-light overflow-hidden">
                    <div class="product-image-wrapper">
                        <img th:src="${producto.imagenUrl}" class="card-img-top product-img" th:alt="${producto.titulo}"
                            onerror="this.src='/img/placeholder-product.png'">
                        <div class="product-badge">
                            <span
                                class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25"
                                th:text="${producto.categoria}">
                                Categoría
                            </span>
                        </div>
                    </div>
                    <div class="card-body d-flex flex-column p-4">
                        <div class="product-title-wrapper mb-2">
                            <h5 class="card-title fw-semibold text-dark product-title" th:text="${producto.titulo}">
                            </h5>
                        </div>
                        <div class="product-description-wrapper mb-3 flex-grow-1">
                            <p class="card-text text-muted small product-description" th:text="${producto.descripcion}">
                            </p>
                        </div>
                        <div class="mt-auto">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="product-price fw-bold fs-5 text-primary">
                                    S/ <span th:text="${#numbers.formatDecimal(producto.precio, 1, 2)}"></span>
                                </span>
                                <span class="text-muted small">
                                    <i class="bi bi-box-seam me-1"></i>
                                    <span th:text="${producto.stock != null ? producto.stock : 'Disponible'}"></span>
                                </span>
                            </div>
                            <a th:href="@{'/tienda/' + ${producto.id}}"
                                class="btn btn-outline-primary w-100 btn-view-product">
                                <i class="bi bi-eye me-2"></i>
                                Ver Detalle
                            </a>
                            <div class="d-flex justify-content-between mt-3 pt-3 border-top">
                                <small class="text-muted">
                                    <i class="bi bi-truck me-1"></i>
                                    Envío gratis
                                </small>
                                <small class="text-success">
                                    <i class="bi bi-check-circle me-1"></i>
                                    En stock
                                </small>
                            </div>
                        </div>
                    </div>
                    <div class="card-hover-effect"></div>
                </div>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(productos)}" class="text-center py-5">
            <div class="empty-state">
                <i class="bi bi-inbox display-1 text-muted mb-4"></i>
                <h4 class="text-muted mb-3">No hay productos en esta categoría</h4>
                <p class="text-muted mb-4">Intenta con otra categoría o vuelve más tarde</p>
                <a href="?" class="btn btn-primary">
                    <i class="bi bi-arrow-clockwise me-2"></i>
                    Ver todos los productos
                </a>
            </div>
        </div>
    </div>


    <!-- Footer -->
    <div th:replace="fragments/footer :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Botón Flotante de Subir -->
    <button id="btnScrollTop" class="btn-scroll-top">
        ↑
    </button>
    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const btn = document.getElementById("btnScrollTop");

            // Mostrar el botón cuando se baja más de 300px
            window.addEventListener("scroll", () => {
                if (window.scrollY > 300) {
                    btn.classList.add("show");
                } else {
                    btn.classList.remove("show");
                }
            });

            // Subir suavemente
            btn.addEventListener("click", () => {
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            });

        });
    </script>

            const navbar = document.getElementById("mainNav");

            function ajustarTop() {

                }
            }
        
            ajustarTop();
        
            window.addEventListener("resize", ajustarTop);
        });*/
    </script>


</body>

</html>
