<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - TecToons</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background: #0d0d0d;
            color: white;
            font-family: 'Poppins', sans-serif;
        }

        .header-banner {
            background: linear-gradient(135deg, #111, #222, #151515);
            padding: 50px 20px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
        }

        .header-banner h2 {
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header-banner p {
            opacity: 0.8;
            font-size: 15px;
        }

        .dashboard-card {
            background: #1a1a1a;
            border: 1px solid #2c2c2c;
            border-radius: 16px;
            padding: 35px 25px;
            text-align: center;
            transition: 0.3s ease;
            cursor: pointer;
        }

        .dashboard-card:hover {
            transform: translateY(-7px);
            box-shadow: 0px 15px 25px rgba(255, 255, 255, 0.05);
        }

        .dashboard-card i {
            font-size: 48px;
            margin-bottom: 15px;
            color: #0d6efd;
        }

        .dashboard-card h5 {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .dashboard-card p {
            opacity: 0.75;
            font-size: 14px;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>

<body>

    <!-- NAVBAR ADMIN -->
    <div th:replace="fragments/navbar-admin :: navbar-admin"></div>

    <div class="container py-5">

        <!-- Encabezado -->
        <div class="header-banner mb-5 text-center">
            <h2>🛡️ Dashboard Administrativo</h2>
            <p>Gestiona las solicitudes de artistas y supervisa el flujo de creadores dentro de la plataforma.</p>
        </div>

        <!-- TARJETAS DEL ADMIN -->
        <div class="row justify-content-center">

            <!-- SOLICITUDES DE ARTISTA -->
            <div class="col-12 col-md-6 col-lg-4">
                <a th:href="@{/admin/solicitudes-artista}" class="text-decoration-none text-white">
                    <div class="dashboard-card">
                        <i class="bi bi-person-check-fill"></i>
                        <h5>Solicitudes de Artista</h5>
                        <p>Revisa, aprueba o rechaza las solicitudes enviadas por los usuarios.</p>
                    </div>
                </a>
            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
