<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Solicitudes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="icon" th:href="@{/img/logotectoonsadmin.png}" type="image/png">
      <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>

<body>
    <!-- NAVBAR ADMIN -->
    <div th:replace="fragments/navbar-admin :: navbar-admin"></div>
    <div class="container mt-5">
        <h2>Solicitudes de Artista</h2>

        <div class="mb-3">
            <a th:href="@{/admin/solicitudes-artista}" class="btn btn-secondary">Todas</a>
            <a th:href="@{/admin/solicitudes-artista/estado/PENDIENTE}" class="btn btn-warning">Pendientes</a>
            <a th:href="@{/admin/solicitudes-artista/estado/APROBADA}" class="btn btn-success">Aprobadas</a>
            <a th:href="@{/admin/solicitudes-artista/estado/RECHAZADA}" class="btn btn-danger">Rechazadas</a>
        </div>

        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Nombre Artístico</th>
                    <th>Categoría</th>
                    <th>Motivo</th>
                    <th>Evidencia</th>
                    <th>Estado</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="solicitud : ${solicitudes}">
                    <td th:text="${solicitud.usuario.nombreUsuario}"></td>
                    <td th:text="${solicitud.nombreArtistico}"></td>
                    <td th:text="${solicitud.categoriaPrincipal}"></td>
                    <td th:text="${solicitud.motivo}"></td>
                    <td>
                        <a th:if="${solicitud.evidenciaUrl}" th:href="${solicitud.evidenciaUrl}" target="_blank">Ver
                            evidencia</a>
                        <span th:if="${#strings.isEmpty(solicitud.evidenciaUrl)}">N/A</span>
                    </td>
                    <td th:text="${solicitud.estado}"></td>
                    <td th:text="${#temporals.format(solicitud.fechaSolicitud, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <form th:action="@{|/admin/solicitudes-artista/${solicitud.id}/aprobar|}" method="post"
                            style="display:inline">
                            <button type="submit" class="btn btn-sm btn-success"
                                th:if="${solicitud.estado.name() == 'PENDIENTE'}">Aprobar</button>
                        </form>
                        <form th:action="@{|/admin/solicitudes-artista/${solicitud.id}/rechazar|}" method="post"
                            style="display:inline">
                            <button type="submit" class="btn btn-sm btn-danger"
                                th:if="${solicitud.estado.name() == 'PENDIENTE'}">Rechazar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
