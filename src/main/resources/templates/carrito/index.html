<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - TecToons</title>
    <link rel="icon" th:href="@{/img/logotectoons4.png}" type="image/png">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/carrito.css}">

</head>

<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container my-5" id="carrito-container">

        <h1 class="mb-4">Mi Carrito</h1>

        <!-- CARRITO VACÍO -->
        <div th:if="${carrito.items.isEmpty()}" class="empty-box">
            <p class="fs-5 mb-3">Tu carrito está vacío.</p>
            <a th:href="@{/tienda}" class="btn btn-primary px-4 py-2">Ir a la tienda</a>
        </div>

        <!-- CARRITO LLENO -->
        <div th:if="${!carrito.items.isEmpty()}">

            <table class="table table-striped align-middle" id="carrito-table">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio Unitario</th>
                        <th>Cantidad</th>
                        <th>Subtotal</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${carrito.items}">
                        <td th:text="${item.producto.titulo}"></td>
                        <td th:text="'S/ ' + ${item.producto.precio}"></td>
                        <td th:text="${item.cantidad}"></td>
                        <td th:text="'S/ ' + ${item.subtotal}"></td>
                        <td>

                            <form th:action="@{'/carrito/aumentar/' + ${item.producto.id}}" method="post"
                                class="d-inline">
                                <button class="btn btn-sm btn-success">+</button>
                            </form>

                            <form th:action="@{'/carrito/disminuir/' + ${item.producto.id}}" method="post"
                                class="d-inline">
                                <button class="btn btn-sm btn-warning">-</button>
                            </form>

                            <form th:action="@{'/carrito/eliminar/' + ${item.producto.id}}" method="post"
                                class="d-inline">
                                <button class="btn btn-sm btn-danger">Eliminar</button>
                            </form>

                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- TOTAL -->
            <h4 class="text-end total-box">
                Total: <span th:text="'S/ ' + ${carrito.total}"></span>
            </h4>

            <!-- PAGAR -->
            <form th:action="@{/carrito/pagar}" method="post" class="text-end">
                <a th:href="@{/tienda}" class="btn btn-pagar mt-3">
                    ← Regresar a la tienda
                </a>
                <button type="submit" class="btn btn-pagar mt-3">Proceder al Pago</button>
            </form>
        </div>
    </div>

    <!-- MODAL DE STOCK -->
    <div class="modal fade" id="stockModal" tabindex="-1" aria-labelledby="stockModalLabel" aria-hidden="true"
        th:if="${errorStock != null}">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="stockModalLabel">Stock Insuficiente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" th:text="${errorStock}">
                    No hay suficiente stock para este producto.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:if="${errorStock != null}">
        document.addEventListener('DOMContentLoaded', function () {
            var stockModal = new bootstrap.Modal(document.getElementById('stockModal'));
            stockModal.show();
        });
    </script>
</body>

</html>
