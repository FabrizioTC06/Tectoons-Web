<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pago - TecToons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5 text-center">

    <h1>Pago con Yape (Simulado)</h1>
    <p class="mb-4">Escanea el siguiente código QR para simular tu pago.</p>

    <img src="/img/qr-yape.png" class="img-fluid mb-4" style="max-width: 280px;" alt="QR Yape">

    <h3 class="fw-bold text-success">
        Total a pagar: S/. <span th:text="${cart.total}"></span>
    </h3>

    <form action="/cart/confirm-payment" method="post">
        <button class="btn btn-lg btn-primary mt-4">
            He realizado el pago
        </button>
    </form>

</div>

</body>
</html>
