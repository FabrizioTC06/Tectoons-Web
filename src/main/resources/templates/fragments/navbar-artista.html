<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header TecToons</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header th:fragment="navbar-artista">
        <nav class="navbar navbar-expand-lg navbar-dark sticky-top navbar-exentica shadow-sm py-2" id="mainNav">
            <div class="container-fluid px-4">

                <!-- LOGO -->
                <a class="navbar-brand d-flex align-items-center" th:href="@{/artista/index}">
                    <img th:src="@{/img/logotectoonsartista2.png}" alt="TecToons Logo" width="45" height="45"
                        class="me-2">
                    <span class="fw-bold text-light fs-4">TecToons</span>
                </a>

                <!-- TOGGLER -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavArtista">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- NAV -->
                <div class="collapse navbar-collapse justify-content-between" id="navbarNavArtista">

                    <!-- CENTRO -->
                    <ul class="navbar-nav mx-auto text-center">

                        <!-- MIS PRODUCTOS -->
                        <li class="nav-item dropdown">
                            <a class="nav-link fw-semibold" th:href="@{/artista/mis-productos}">Mis Productos</a>
                        </li>

                        <!-- MIS OBRAS -->
                        <li class="nav-item dropdown">
                            <a class="nav-link fw-semibold" th:href="@{/artista/mis-obras}">Mis Obras</a>
                        </li>

                        <!-- PERFIL ARTÍSTICO -->
                        <li class="nav-item">
                            <a class="nav-link fw-semibold" th:href="@{/artista/mi-perfil}">Mi Perfil Artístico</a>
                        </li>

                        <!-- MIS POSTS -->
                        <li class="nav-item">
                            <a class="nav-link fw-semibold" th:href="@{/artista/mis-posts}">Mis Posts</a>
                        </li>
                    </ul>

                    <!-- DERECHA -->
                    <ul class="navbar-nav align-items-center">

                        <!-- BUSCADOR -->
                        <li class="nav-item me-2">
                            <form class="d-flex align-items-center" th:action="@{/buscar}" method="get">
                                <input class="form-control form-control-sm rounded-pill search-box" type="search"
                                    name="q" placeholder="Buscar..." aria-label="Buscar">
                            </form>
                        </li>

                        <!-- CARRITO -->
                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/carrito}">
                                <i class="bi bi-cart3 fs-5"></i>
                            </a>
                        </li>

                        <!-- USUARIO -->
                        <li class="nav-item dropdown ms-2">

                            <a class="nav-link text-white d-flex align-items-center" href="#" data-bs-toggle="dropdown">
                                <i class="bi bi-person-circle fs-5 me-1"></i>
                                <span class="fw-semibold"
                                    th:text="${#authentication.principal.nombreUsuario}">Usuario</span>
                            </a>

                            <ul class="dropdown-menu dropdown-menu-end fade-in">

                                <li>
                                    <h6 class="dropdown-header text-primary fw-bold">
                                        👋 Hola, <span
                                            th:text="${#authentication.principal.nombreUsuario}">Usuario</span>
                                    </h6>
                                </li>

                                <li><a class="dropdown-item" th:href="@{/usuario/perfil}">
                                        <i class="bi bi-person-badge me-2"></i>Mi Perfil</a>
                                </li>
                                <!--
                                <li><a class="dropdown-item" th:href="@{/mis-compras}">
                                        <i class="bi bi-bag-check me-2"></i>Mis Compras</a>
                                </li>
-->
                                <!-- SER ARTISTA (solo si NO es artista) -->
                                <li th:if="!${#authorization.expression('hasRole(''ROLE_ARTISTA'')')}">
                                    <a class="dropdown-item" th:href="@{/solicitud_artista}">
                                        <i class="bi bi-stars me-2"></i>Ser Artista
                                    </a>
                                </li>

                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li>
                                    <button class="dropdown-item" onclick="cambiarAModoUsuario()">
                                        👤 Modo Usuario
                                    </button>
                                </li>

                                <li th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'')')}">
                                    <button class="dropdown-item" onclick="cambiarAModoAdmin()">
                                        🛠️ Modo Admin
                                    </button>
                                </li>
                                <script>
                                    function cambiarAModoUsuario() {
                                        const url = window.location.pathname;

                                        if (url.startsWith('/artista/mis-obras')) {
                                            window.location.href = '/portafolio-obras';
                                        }
                                        else if (url.startsWith('/artista/mis-productos')) {
                                            window.location.href = '/tienda';
                                        }
                                        else if (url.startsWith('/artista/mis-posts')) {
                                            window.location.href = '/blog';
                                        }
                                        else if (url.startsWith('/artista/mi-perfil')) {
                                            window.location.href = '/lista-artistas';
                                        }
                                        else {
                                            window.location.href = '/';
                                        }
                                    }

                                    function cambiarAModoAdmin() {
                                        window.location.href = '/admin/index';
                                    }
                                </script>




                                <!-- LOGOUT -->
                                <li>
                                    <a class="dropdown-item text-danger" th:href="@{/logout}">
                                        <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
                                    </a>
                                </li>

                            </ul>
                        </li>

                    </ul>

                </div>
            </div>
        </nav>


    </header>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
