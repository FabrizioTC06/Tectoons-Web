<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header TecToons</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header th:fragment="navbar-admin">
        <nav class="navbar navbar-expand-lg navbar-dark sticky-top navbar-exentica shadow-sm py-2" id="mainNav">
            <div class="container-fluid px-4">

                <!-- IZQUIERDA: Logo -->
                <a class="navbar-brand d-flex align-items-center" th:href="@{/admin/index}">
                    <img th:src="@{/img/logotectoons4.png}" alt="TecToons Logo" width="45" height="45" class="me-2">
                    <span class="fw-bold text-light fs-4">TecToons ADMIN</span>
                </a>

                <!-- BOTÓN RESPONSIVE -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- CONTENIDO -->
                <div class="collapse navbar-collapse justify-content-between" id="navbarNav">

                    <!-- CENTRO: Navegación principal -->
                    <ul class="navbar-nav mx-auto text-center">


                        <li class="nav-item"><a class="nav-link fw-semibold"
                                th:href="@{/admin/solicitudes-artista}">Solicitudes Para Ser Artistas</a></li>

                        <!--<li class="nav-item dropdown">
              <a class="nav-link fw-semibold" href="#" id="serviciosMenu" data-bs-toggle="dropdown">Servicios</a>
              <ul class="dropdown-menu fade-in">
                <li><a class="dropdown-item" th:href="@{/servicios/diseno}">Diseño Gráfico</a></li>
                <li><a class="dropdown-item" th:href="@{/servicios/ilustracion}">Ilustración</a></li>
                <li><a class="dropdown-item" th:href="@{/servicios/animacion}">Animación</a></li>
                <li><a class="dropdown-item" th:href="@{/servicios/branding}">Branding</a></li>
                <li><a class="dropdown-item" th:href="@{/servicios/comisiones}">Comisiones Personalizadas</a></li>
              </ul>
            </li>-->

                        <!--<li class="nav-item"><a class="nav-link fw-semibold" th:href="@{/blog}">Blog</a></li>-->
                    </ul>

                    <!-- DERECHA: Buscador + Iconos -->
                    <ul class="navbar-nav align-items-center">

                        <!-- 🔍 Buscador 
            <li class="nav-item me-2">
              <form class="d-flex align-items-center" th:action="@{/buscar}" method="get">
                <input class="form-control form-control-sm rounded-pill search-box" type="search" name="q"
                  placeholder="Buscar..." aria-label="Buscar">
              </form>
            </li>

             🛒 Carrito 
            <li class="nav-item">
              <a class="nav-link text-white" th:href="@{/carrito}">
                <i class="bi bi-cart3 fs-5"></i>
              </a>
            </li>-->

                        <!-- 👤 Usuario -->
                        <li class="nav-item dropdown ms-2">

                            <!-- Si NO hay usuario -->
                            <a class="nav-link text-white"
                                th:if="${#authentication == null or #authentication.principal == 'anonymousUser'}"
                                href="#" role="button" data-bs-toggle="dropdown">
                                <i class="bi bi-person-circle fs-5"></i>
                            </a>

                            <ul th:if="${#authentication == null or #authentication.principal == 'anonymousUser'}"
                                class="dropdown-menu dropdown-menu-end fade-in">
                                <li><a class="dropdown-item" th:href="@{/usuario/login}">Iniciar sesión</a></li>
                                <li><a class="dropdown-item" th:href="@{/usuario/registro}">Registrarse</a></li>

                            </ul>


                            <!-- Si SÍ hay usuario -->
                            <a class="nav-link text-white d-flex align-items-center"
                                th:if="${#authentication != null and #authentication.principal != 'anonymousUser'}"
                                href="#" role="button" data-bs-toggle="dropdown">

                                <i class="bi bi-person-circle fs-5 me-1"></i>

                                <!-- Mostrar nombre del usuario -->
                                <span class="fw-semibold" th:text="${#authentication.principal.nombreUsuario}">
                                    Usuario
                                </span>

                            </a>

                            <ul th:if="${#authentication != null and #authentication.principal != 'anonymousUser'}"
                                class="dropdown-menu dropdown-menu-end fade-in">

                                <li>
                                    <h6 class="dropdown-header text-primary fw-bold">
                                        👋 Hola, <span
                                            th:text="${#authentication.principal.nombreUsuario}">Usuario</span>
                                    </h6>
                                </li>

                                <li><a class="dropdown-item" th:href="@{/usuario/perfil}">
                                        <i class="bi bi-person-badge me-2"></i>Mi Perfil</a></li>
                                <!--
                <li><a class="dropdown-item" th:href="@{/mis-compras}">
                    <i class="bi bi-bag-check me-2"></i>Mis Compras</a></li>
-->
                                <li>
                                    <hr class="dropdown-divider">
                                </li>

                                <li th:if="${!#authorization.expression('hasRole(''ROLE_ARTISTA'')')}">
                                    <a class="dropdown-item" th:href="@{/solicitud-artista}">Ser artista</a>
                                </li>

                                <li>
                                    <hr class="dropdown-divider">
                                </li>


                                <li>
                                    <button class="dropdown-item" onclick="cambiarAModoUsuario()">
                                        👤 Modo Usuario
                                    </button>
                                </li>

                                <li th:if="${#authorization.expression('hasRole(''ROLE_ARTISTA'')')}">
                                    <button class="dropdown-item" onclick="cambiarAModoArtista()">
                                        🎨 Modo Artista
                                    </button>
                                </li>
                                <script>
                                    function cambiarAModoArtista() {
                                        window.location.href = '/artista/index';

                                    }

                                    function cambiarAModoUsuario() {
                                        window.location.href = '/';
                                    }

                                </script>



                                <!-- logout de spring security -->
                                <li><a class="dropdown-item text-danger" th:href="@{/logout}">
                                        <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
                                    </a></li>

                            </ul>

                        </li>
                    </ul>
                </div>
            </div>
        </nav>

    </header>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
