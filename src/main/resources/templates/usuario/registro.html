<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - TecToons</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" th:href="@{/img/logotectoons4.png}" type="image/png">

  <!-- CSS personalizado -->
  <link th:href="@{/css/registro.main.css}" rel="stylesheet">
</head>

<body class="register-bg d-flex align-items-center justify-content-center min-vh-100">

  <!-- Header simple con logo -->
  <header class="header">
    <div class="d-flex align-items-center">
      <img th:src="@{/img/logotectoons4.png}" alt="TecToons Logo" class="logo">
      <span class="brand-name ms-2">Tec<span class="highlight">Toons</span></span>
    </div>
  </header>

  <!-- Contenedor -->
  <div class="register-card shadow-lg rounded-4 p-4 mx-3 text-light">
    <h2 class="text-center mb-4 fw-bold text-warning">Crear una cuenta</h2>

    <!-- ✅ Mensajes -->
    <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>
    <div th:if="${exito}" class="alert alert-success text-center" th:text="${exito}"></div>

    <!-- ✅ Formulario -->
    <form th:action="@{/usuario/registro}" th:object="${usuario}" method="post" novalidate>

      <!--<div class="mb-3">
        <label for="dni" class="form-label fw-semibold">DNI</label>
        <input type="text" th:field="*{dni}" id="dni" class="form-control" maxlength="8" placeholder="Ingresa tu DNI" required>
        <small th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}" class="text-warning"></small>
      </div>-->

      <div class="mb-3">
        <label for="nombreCompleto" class="form-label fw-semibold">Nombre completo</label>
        <input type="text" th:field="*{nombreCompleto}" id="nombreCompleto" class="form-control"
          placeholder="Tu nombre completo" required>
      </div>

      <div class="mb-3">
        <label for="nombreUsuario" class="form-label fw-semibold">Nombre de usuario</label>
        <input type="text" th:field="*{nombreUsuario}" id="nombreUsuario" class="form-control"
          placeholder="Ej. tec_user" required>
      </div>

      <div class="mb-3">
        <label for="correo" class="form-label fw-semibold">Correo electrónico</label>
        <input type="email" th:field="*{correo}" id="correo" class="form-control" placeholder="ejemplo@correo.com"
          required>
      </div>

      <div class="mb-3">
        <label for="contrasena" class="form-label fw-semibold">Contraseña</label>
        <input type="password" th:field="*{contrasena}" id="contrasena" class="form-control"
          placeholder="Crea una contraseña" required>
      </div>

      <div class="mb-4">
        <label for="fechaNacimiento" class="form-label fw-semibold">Fecha de nacimiento</label>
        <input type="date" th:field="*{fechaNacimiento}" id="fechaNacimiento" class="form-control">
      </div>

      <button type="submit" class="register-btn w-100 fw-semibold">Crear cuenta</button>
    </form>

    <hr class="my-4 border-light opacity-50">
    <p class="text-center mb-0 text-light">
      ¿Ya tienes cuenta?
      <a th:href="@{/usuario/login}" class="fw-bold text-warning text-decoration-none">Inicia sesión</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
