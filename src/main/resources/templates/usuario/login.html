<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - TecToons</title>
    <link rel="icon" th:href="@{/img/logotectoons4.png}" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/css/login.main.css}">
</head>

<body class="login-bg d-flex align-items-center justify-content-center vh-100">

    <!-- 🔹 Tarjeta principal -->
    <div class="login-card p-4 rounded-4 shadow-lg text-white">
        <div class="text-center mb-4">
            <img th:src="@{/img/logotectoons4.png}" alt="Logo TecToons" class="logo-login mb-3">
            <h3 class="fw-bold">Iniciar Sesión</h3>
            <p class="text-light mb-0">Bienvenido de nuevo 👋</p>
        </div>

        <!-- ✅ Mensajes -->
        <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>
        <div th:if="${exito}" class="alert alert-success text-center" th:text="${exito}"></div>

        <!-- ✅ Formulario -->
        <form th:action="@{/usuario/login}" method="post">
            <div class="mb-3">
                <label for="identificador" class="form-label text-white fw-semibold">Correo o Usuario</label>
                <input type="text" id="identificador" name="identificador" th:value="${identificador}"
                    class="form-control" placeholder="Ingresa tu usuario o correo" required>
            </div>

            <div class="mb-3">
                <label for="contrasena" class="form-label text-white fw-semibold">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" class="form-control" placeholder="********"
                    required>
            </div>

            <button type="submit" class="login-btn w-100 fw-semibold">Iniciar Sesión</button>

            <div class="text-center mt-4">
                <span class="text-light">¿No tienes cuenta?</span>
                <a th:href="@{/usuario/registro}" class="text-warning fw-bold text-decoration-none ms-1">Regístrate</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
