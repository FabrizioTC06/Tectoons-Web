<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${post.titulo}"></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tipografía -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" th:href="@{/img/logotectoons4.png}" type="image/png">

    <!-- estilos -->
    <link rel="stylesheet" th:href="@{/css/artistas.main.css}">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
        body {
            background: #f4f6f9;
            font-family: "Inter", sans-serif;
            line-height: 1.7;
        }

        .header-img-container {
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .15);
        }

        .post-header-img {
            width: 100%;
            height: 460px;
            object-fit: cover;
        }

        .back-btn {
            background: #212529;
            border-radius: 50px;
            font-size: 0.9rem;
            padding: 8px 18px;
            transition: .2s;
        }

        .back-btn:hover {
            background: #000;
        }

        h1 {
            font-weight: 800;
            font-size: 2.6rem;
            color: #212529;
        }

        .post-meta {
            color: #6f6f6f;
            font-size: 1rem;
        }

        .post-content {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .08);
            font-size: 1.1rem;
        }
    </style>
</head>

<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container py-5" style="max-width: 900px;">

        <a href="/blog" class="back-btn text-white text-decoration-none mb-4 d-inline-block">
            ← Volver al Blog
        </a>

        <div class="header-img-container mb-4">
            <img th:src="${post.imagenUrl}" class="post-header-img">
        </div>

        <h1 class="mb-3" th:text="${post.titulo}"></h1>

        <p class="post-meta mb-4">
            <strong th:text="'Por ' + ${post.artista.nombreArtistico}"></strong> ·
            <span th:text="${post.fechaPublicacion}"></span>
        </p>

        <div class="post-content mb-5">
            <p th:text="${post.contenido}"></p>
        </div>

    </div>
    <!-- Footer -->
    <div th:replace="fragments/footer :: footer"></div>
</body>

</html>
